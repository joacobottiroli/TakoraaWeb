<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Takoraa — The AI gateway that thinks before it spends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0f4c81;
    --primary-700: #0a3a64;
    --cyan: #009fe3;
    --green: #97d700;
    --green-deep: #6fa300;
    --off-white: #f4f5f0;
    --bg: #ffffff;
    --ink: #373a3c;
    --ink-soft: #5b6063;
    --ink-mute: #8a8f93;
    --line: #e7e8e2;
    --line-strong: #d9dad3;
    --code-bg: #0d1014;
    --code-line: #1c2128;
    --code-ink: #c9d1d9;
    --code-mute: #6e7681;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  section[id], [id="billing"], [id="product"], [id="integration"] { scroll-margin-top: 72px; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 15px;
    line-height: 1.5;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .display { font-family: 'Montserrat', sans-serif; letter-spacing: -0.025em; }

  .page {
    position: relative;
    background: var(--bg);
    width: 100%;
    overflow-x: hidden;
  }
  section { border-bottom: 1px solid var(--line); }

  /* Nav */
  .nav-wrap {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.82);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav {
    max-width: 1240px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 32px;
  }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .logo-word { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .nav-menu { display: flex; gap: 4px; }
  .nav-menu a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 13.5px;
    padding: 7px 12px;
    border-radius: 6px;
    transition: color .15s, background .15s;
  }
  .nav-menu a:hover { color: var(--ink); background: var(--off-white); }
  .nav-cta { display: flex; align-items: center; gap: 6px; }
  .btn {
    font-family: 'Inter', sans-serif; font-weight: 500;
    font-size: 13.5px;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--line-strong);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    line-height: 1;
  }
  .btn:hover { border-color: var(--ink); }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { color: var(--ink); background: var(--off-white); border-color: transparent; }
  .btn-primary {
    background: var(--primary); color: #fff; border-color: var(--primary);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 1px 0 rgba(15,76,129,0.25);
  }
  .btn-primary:hover { background: var(--primary-700); border-color: var(--primary-700); }
  .btn-lg { padding: 12px 18px; font-size: 14px; border-radius: 7px; }
  .btn .arrow { transition: transform .2s; }
  .btn:hover .arrow { transform: translateX(2px); }

  /* Hero — full-width split background */
  .hero {
    position: relative;
    min-height: calc(100vh - 57px);
    background: linear-gradient(to right, #ffffff 0%, #ffffff 50%, var(--off-white) 50%, var(--off-white) 100%);
    overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 50%;
    background:
      radial-gradient(circle at 20% 0%, rgba(0,159,227,0.06), transparent 60%),
      radial-gradient(circle at 100% 100%, rgba(151,215,0,0.07), transparent 55%);
    pointer-events: none;
  }
  .hero::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 50%;
    background-image: radial-gradient(circle, rgba(55,58,60,0.09) 1px, transparent 1px);
    background-size: 22px 22px;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 35%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 35%, transparent 78%);
    pointer-events: none;
  }
  .hero-divider {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 1px; background: var(--line);
    pointer-events: none;
    transform: translateX(-0.5px);
    z-index: 1;
  }
  .hero-inner {
    position: relative; z-index: 2;
    max-width: 1240px; width: 100%;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: calc(100vh - 57px);
    align-items: stretch;
  }
  .hero-left {
    padding: 80px 56px 80px 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 11px 5px 6px;
    background: #fff;
    width: fit-content;
    margin-bottom: 28px;
  }
  .eyebrow .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    background: var(--off-white);
    padding: 2px 7px; border-radius: 999px;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  h1.hero-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 0.98;
    letter-spacing: -0.035em;
    margin: 0 0 22px;
    color: var(--ink);
  }
  h1.hero-title em {
    font-style: normal;
    background: linear-gradient(180deg, transparent 60%, rgba(151,215,0,0.45) 60%);
    padding: 0 2px;
  }
  .hero-sub {
    font-size: 17px;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 0 36px;
    line-height: 1.45;
  }
  .hero-cta { display: flex; gap: 10px; align-items: center; margin-bottom: 32px; }
  .hero-meta {
    display: flex; align-items: center; gap: 18px;
    font-size: 12.5px; color: var(--ink-mute);
  }
  .hero-meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 6px; box-shadow: 0 0 0 3px rgba(151,215,0,0.18); }
  .hero-meta-item { display: inline-flex; align-items: center; }

  .hero-right {
    padding: 56px 0 56px 56px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* Section header */
  .section-head {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 88px 32px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    align-items: end;
  }
  .section-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 14px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .section-eyebrow::before {
    content: ""; width: 18px; height: 1px; background: var(--primary);
  }
  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 42px;
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin: 0;
    max-width: 520px;
  }
  .section-desc {
    color: var(--ink-soft);
    font-size: 15.5px;
    line-height: 1.55;
    max-width: 460px;
    margin: 0;
  }

  /* Bento */
  .features { background: var(--off-white); }
  .bento {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 36px 32px 96px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 290px 290px 290px 290px;
    gap: 14px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px 24px 28px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: visible;
    transition: border-color .15s, transform .2s;
    min-height: 0;
  }
  .card:hover { border-color: var(--line-strong); }
  .card-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-mute);
  }
  .card-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 6px 0 6px;
  }
  .card-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0;
    max-width: 380px;
  }
  .card-body { flex: 1; margin-top: 16px; position: relative; min-height: 0; }
  .b-routing  { grid-column: span 4; grid-row: 1 / span 2; }
  .b-cache    { grid-column: span 2; grid-row: 1 / span 1; }
  .b-pruning  { grid-column: span 2; grid-row: 2 / span 1; }
  .b-insights { grid-column: span 4; grid-row: 3 / span 2; }
  .b-keys     { grid-column: span 2; grid-row: 3 / span 2; }

  /* Integration */
  .integrate {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 96px 32px;
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    gap: 56px;
    align-items: center;
  }
  .integrate-copy h2 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 44px;
    line-height: 1.02;
    letter-spacing: -0.03em;
    margin: 14px 0 18px;
  }
  .integrate-copy h2 .num {
    color: var(--primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82em;
    margin-right: 12px;
    font-weight: 600;
  }
  .integrate-copy p {
    color: var(--ink-soft);
    font-size: 15.5px; line-height: 1.6;
    max-width: 440px;
    margin: 0 0 22px;
  }
  .integrate-stats { display: flex; gap: 28px; margin-top: 16px; }
  .integrate-stat .num {
    font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 28px; letter-spacing: -0.02em; color: var(--primary);
    line-height: 1;
  }
  .integrate-stat .num.green { color: var(--green-deep); }
  .integrate-stat .lbl { font-size: 12px; color: var(--ink-mute); margin-top: 6px; }

  .diff {
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--code-bg);
    box-shadow: 0 24px 60px -30px rgba(15,76,129,0.45), 0 8px 24px -12px rgba(0,0,0,0.25);
  }
  .diff-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: #11151a;
    border-bottom: 1px solid var(--code-line);
  }
  .diff-head .file { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--code-mute); }
  .diff-tabs { display: flex; gap: 4px; }
  .diff-tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 5px;
    color: var(--code-mute);
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
  }
  .diff-tab.active { color: #e6edf3; border-color: var(--code-line); background: #0d1014; }
  .diff-body {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--code-ink);
    padding: 14px 0;
  }
  .diff-row { display: grid; grid-template-columns: 36px 14px 1fr; padding: 0 14px 0 0; white-space: pre; }
  .diff-row .ln { color: #444c56; text-align: right; padding-right: 8px; user-select: none; font-size: 11.5px; }
  .diff-row .sign { color: var(--code-mute); }
  .diff-row.add { background: rgba(151,215,0,0.07); }
  .diff-row.add .sign { color: var(--green); }
  .diff-row.del { background: rgba(232,80,80,0.08); }
  .diff-row.del .sign { color: #e85050; }
  .tk-key { color: #f97583; }
  .tk-str { color: #a5d6ff; }
  .tk-prop { color: #79c0ff; }
  .tk-com { color: #6e7681; font-style: italic; }
  .tk-fn  { color: #d2a8ff; }
  .tk-punc{ color: #c9d1d9; }
  .tk-green { color: var(--green); }

  /* Billing */
  .billing { background: #fff; }
  .billing-grid {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 28px 32px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .bill-card {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 28px 28px 30px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .bill-card--accent { background: var(--off-white); border-color: var(--line-strong); }
  .bill-card-num { position: absolute; top: 18px; right: 22px; font-size: 11px; color: var(--ink-mute); letter-spacing: 0.08em; }
  .bill-card-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--primary); margin-bottom: 14px; }
  .bill-card-amount { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .bill-card-amount .display { font-weight: 700; font-size: 44px; line-height: 1; color: var(--ink); letter-spacing: -0.03em; }
  .bill-card-dash { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 28px; color: var(--ink-mute); line-height: 1; }
  .bill-card-unit { font-size: 12px; color: var(--ink-mute); margin-left: 4px; }
  .bill-card-desc { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; max-width: 460px; }

  .billing-table-wrap { max-width: 1240px; width: 100%; margin: 0 auto; padding: 12px 32px 96px; }
  .billing-table-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }
  .billing-table-eyebrow { font-size: 11px; color: var(--ink-mute); letter-spacing: 0.04em; }
  .billing-table-title { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); letter-spacing: -0.01em; }
  .billing-table {
    background: var(--code-bg);
    border: 1px solid var(--code-line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px -30px rgba(15,76,129,0.45), 0 8px 24px -12px rgba(0,0,0,0.25);
  }
  .bt-row { display: grid; grid-template-columns: 1.1fr 1fr 1.1fr 0.9fr 1fr 1.2fr; align-items: center; }
  .bt-row--head { background: #11151a; border-bottom: 1px solid var(--code-line); padding: 14px 0; }
  .bt-row--head > div { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--code-mute); padding: 0 22px; }
  .bt-row:not(.bt-row--head) { border-bottom: 1px dashed rgba(255,255,255,0.06); padding: 18px 0; transition: background .15s; }
  .bt-row:not(.bt-row--head):last-child { border-bottom: none; }
  .bt-row:not(.bt-row--head):hover { background: rgba(0,159,227,0.04); }
  .bt-cell { padding: 0 22px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .bt-label { display: none; font-size: 10px; color: var(--code-mute); text-transform: uppercase; letter-spacing: 0.08em; }
  .bt-spend { gap: 2px; }
  .bt-spend .display { font-weight: 700; font-size: 24px; color: #e6edf3; letter-spacing: -0.02em; line-height: 1; }
  .bt-spend .bt-unit { font-size: 11px; color: var(--code-mute); }
  .bt-val { font-size: 17px; color: var(--code-ink); font-family: 'JetBrains Mono', monospace; letter-spacing: -0.01em; }
  .bt-val.display { font-family: 'Montserrat', sans-serif; font-weight: 600; }
  .bt-val--green { color: var(--green); font-weight: 700; }
  .bt-val--accent { color: var(--green); font-weight: 700; font-size: 22px; }
  .bt-cell--total .bt-val { color: #e6edf3; font-size: 18px; }
  .bt-cell--net { border-left: 1px solid rgba(255,255,255,0.06); }
  .billing-foot { margin-top: 16px; font-size: 12px; color: var(--ink-mute); padding: 0 4px; }
  .bt-foot-em { color: var(--green-deep); font-weight: 600; }

  /* Footer */
  footer.foot {
    padding: 64px 0 28px;
    background: #fff;
  }
  .foot-inner {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 0 32px;
  }
  .foot-grid {
    display: grid;
    grid-template-columns: 1.6fr repeat(3, 1fr);
    gap: 40px;
    padding-bottom: 56px;
    border-bottom: 1px solid var(--line);
  }
  .foot-brand .logo-word { font-size: 18px; }
  .foot-tag {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 14px 0 18px;
    max-width: 260px;
    line-height: 1.5;
  }
  .foot-status {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 5px 9px; border-radius: 999px;
  }
  .foot-status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 3px rgba(151,215,0,0.2);
  }
  .foot-col h5 {
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 14px;
  }
  .foot-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
  .foot-col a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 13px;
    transition: color .15s;
  }
  .foot-col a:hover { color: var(--ink); }
  .foot-bottom {
    padding-top: 22px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px;
    color: var(--ink-mute);
    font-family: 'JetBrains Mono', monospace;
  }
  .foot-bottom .legal { display: flex; gap: 16px; }
  .foot-bottom a { color: var(--ink-mute); text-decoration: none; }
  .foot-bottom a:hover { color: var(--ink); }

  /* Logo / Metrics strips */
  .logo-strip { background: #fff; border-bottom: 1px solid var(--line); }
  .logos {
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .logos-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
  }
  .logos-row { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
  .logos-row span {
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--ink-mute);
    letter-spacing: -0.01em;
    opacity: 0.7;
  }

  /* ── Hamburger / mobile menu ── */
  .hamburger {
    display: none;
    align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color .15s, background .15s;
    flex-shrink: 0;
  }
  .hamburger:hover { border-color: var(--ink); background: var(--off-white); }
  .hamburger svg { display: block; }

  .mobile-overlay {
    position: fixed; inset: 0;
    z-index: 200;
    display: flex; flex-direction: column;
    background: #fff;
    transform: translateY(-100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  .mobile-overlay.open { transform: translateY(0); }

  .mobile-overlay-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .mobile-close {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    cursor: pointer;
    padding: 0;
    transition: border-color .15s, background .15s;
  }
  .mobile-close:hover { border-color: var(--ink); background: var(--off-white); }

  .mobile-nav-links {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 24px 20px;
    overflow-y: auto;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;
  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const maxRight = Math.max(PAD, window.innerWidth - panel.offsetWidth - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - panel.offsetHeight - PAD);
    offsetRef.current = { x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)), y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)) };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);
  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);
  React.useEffect(() => {
    const onMsg = (e) => { const t = e?.data?.type; if (t === '__activate_edit_mode') setOpen(true); else if (t === '__deactivate_edit_mode') setOpen(false); };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const dismiss = () => { setOpen(false); window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); };
  const onDragStart = (e) => {
    const panel = dragRef.current; if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, startRight = window.innerWidth - r.right, startBottom = window.innerHeight - r.bottom;
    const move = (ev) => { offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - e.clientY) }; clampToViewport(); };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  };
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value); valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => { const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s); return m === undefined ? s : typeof m === 'object' ? m.value : m; };
    return <TweakSelect label={label} value={value} options={options} onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => { const r = trackRef.current.getBoundingClientRect(); const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n); return opts[Math.max(0, Math.min(n - 1, i))].value; };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX); if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (!trackRef.current) return; const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  };

    <TweakRow label={label}>

        {opts.map((o) => <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>)}
      </div>
    </TweakRow>
  );
}

function RouterDemo() {
  const [scIdx, setScIdx] = React.useState(0);
  const [phase, setPhase] = React.useState(0);
  const [typed, setTyped] = React.useState("");
  const timersRef = React.useRef([]);
  const scenario = SCENARIOS[scIdx];
  const clearTimers = () => { timersRef.current.forEach(t => clearTimeout(t)); timersRef.current = []; };
  const push = (fn, ms) => { const id = setTimeout(fn, ms); timersRef.current.push(id); };
  React.useEffect(() => {
    clearTimers(); setTyped(""); setPhase(0);
    const text = scenario.prompt; const charMs = 22;
    for (let i = 1; i <= text.length; i++) push(() => setTyped(text.slice(0, i)), i * charMs);
    const typeDone = text.length * charMs;
    push(() => setPhase(1), typeDone + 380);
    push(() => setPhase(2), typeDone + 1500);
    push(() => setPhase(3), typeDone + 2700);
    push(() => setScIdx((scIdx + 1) % SCENARIOS.length), typeDone + 6200);
    return clearTimers;
  }, [scIdx]);
  const saved = scenario.fromCost - scenario.toCost;
  const savedPct = Math.round((saved / scenario.fromCost) * 100);
  return (
    <div className="rd-wrap">

            <span className="rd-url-path">/v1/chat/completions</span>
          </div>
          <div className="rd-status mono">
            <span className={`rd-pulse ${phase >= 1 && phase < 3 ? 'live' : ''}`}></span>
            {phase < 3 ? "routing" : "200 OK"}
          </div>
        </div>
        <div className="rd-body">
          <div className="rd-section">
            <div className="rd-section-head">
              <span className="rd-section-label mono">request.prompt</span>
              <span className="rd-section-meta mono">{scenario.tokensIn.toLocaleString()} tokens</span>
            </div>
            <div className="rd-prompt mono">
              <span className="rd-quote">"</span><span>{typed}</span>
              {phase === 0 && <span className="rd-caret"></span>}
              <span className="rd-quote">"</span>
            </div>
          </div>
          <div className={`rd-section rd-analysis ${phase >= 1 ? 'is-active' : ''}`}>
            <div className="rd-section-head">
              <span className="rd-section-label mono">router.classify</span>
              {phase >= 1 && <span className="rd-tag mono">{scenario.classification}</span>}
            </div>
            <div className="rd-models">
              {MODELS.map(m => {
                const isPicked = phase >= 2 && m.key === scenario.pickedKey;
                const isRejected = phase >= 2 && scenario.rejected.includes(m.key);

function MiniChart() {
  const points = [[0,15],[10,13],[20,16],[30,12],[40,15],[50,13],[60,16],[70,14],[80,17],[90,13],[100,15]];
  const optimizedRaw = [[0,15],[10,22],[20,28],[30,34],[40,38],[50,42],[60,45],[70,48],[80,51],[90,52],[100,53]];
  const toPath = (pts) => pts.map((p,i) => (i===0?`M${p[0]},${p[1]}`:`L${p[0]},${p[1]}`)).join(" ");
  const toArea = (pts) => `${toPath(pts)} L100,60 L0,60 Z`;
  return (
    <svg className="mini-chart" viewBox="0 0 100 60" preserveAspectRatio="none">
      <defs>
        <linearGradient id="bento-area-green" x1="0" y1="0" x2="0" y2="1">

      <rect width="100" height="60" fill="url(#bento-grid-pat)"/>
      <path d={toPath(points)} fill="none" stroke="#8a8f93" strokeWidth="0.6" strokeDasharray="1.4 1.4"/>

      <path d={toPath(optimizedRaw)} fill="none" stroke="#6fa300" strokeWidth="1.1" strokeLinecap="round" strokeLinejoin="round" className="mini-chart-line"/>
