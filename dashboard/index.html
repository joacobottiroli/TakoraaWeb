<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Takoraa — AI optimization dashboard</title>
<link rel="stylesheet" href="app.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Shell.jsx"></script>
  <script type="text/babel" src="Login.jsx"></script>
  <script type="text/babel" src="Dashboard.jsx"></script>
  <script type="text/babel" src="Requests.jsx"></script>
  <script type="text/babel" src="ApiKeys.jsx"></script>
  <script type="text/babel" src="Controls.jsx"></script>
  <script type="text/babel" src="Providers.jsx"></script>
  <script type="text/babel">
    function Access() {
      const admins = [
        { name: 'Dana Okoro', email: 'dana@northwind.ai', role: 'Owner' },
        { name: 'Priya Shah', email: 'priya@northwind.ai', role: 'Admin' },
        { name: 'Marc Ellison', email: 'marc@northwind.ai', role: 'Viewer' },
      ];
      return (
        <div className="page">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: 16 }}>
            <PageHeader title="Dashboard access" subtitle="Manage who on your team can sign in to this Takoraa dashboard and what they can change." />
            <button className="btn btn-filled"><Icon name="person_add" /> Invite admin</button>
          </div>
          <div style={{ height: 24 }} />
          <div className="panel" style={{ padding: 0, overflow: 'hidden' }}>
            {admins.map((a, i) => (
              <div key={a.email} style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '16px 18px', borderBottom: i < admins.length - 1 ? '1px solid var(--divider)' : 'none' }}>
                <div style={{ width: 38, height: 38, borderRadius: '50%', background: 'var(--primary-container)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, flex: 'none' }}>{a.name[0]}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{a.name}</div>
                  <div style={{ fontSize: 12.5, color: 'var(--on-surface-var)', marginTop: 2 }}>{a.email}</div>
                </div>
                <span className={`pill ${a.role === 'Viewer' ? 'inactive' : 'active'}`}>{a.role}</span>
                <button className="btn btn-text" style={{ padding: '8px 10px' }}>Edit</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [authed, setAuthed] = React.useState(true);
      const [section, setSection] = React.useState('dashboard');
      const [lang, setLang] = React.useState('en');
      if (!authed) return <Login onLogin={() => setAuthed(true)} />;
      const screen = {
        dashboard: <Dashboard />, requests: <Requests />, apiKeys: <ApiKeys />,
        access: <Access />, providers: <Providers />, controls: <Controls />,
      }[section];
      return (
        <div className="app">
          <Sidebar active={section} onSelect={setSection} onLogout={() => setAuthed(false)} lang={lang} setLang={setLang} />
          <div className="content">{screen}</div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
